<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="title-container">
        <h1>Tic Tac Toe</h1>
    </div>

    <div class="display-turn">
        <h2 id="turn-display"></h2>
    </div>

    <div class="controls">
        <label>
            <input type="checkbox" id="dark-mode-toggle">
            Dark Mode
        </label>
        <label>
            <input type="checkbox" id="delay-toggle" checked>
            Anxiety Mode
        </label>
    </div>

    <div class="game-container">
        <div class="game-board" id="game-board">
            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>
            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>
            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>
        </div>
    </div>

    <div class="display-score">
        <h2 id="score-display">Player Score: 0 | Computer Score: 0 | Draws: 0</h2>
    </div>

    <div class="display-winner">
        <h3 id="winner-display">Winner takes it all</h3>
    </div>

    <div class="reset-btn-container"><button id="replay-btn" class="hidden">Replay</button></div>

    <script src="script.js"></script>

</body>

</html>
